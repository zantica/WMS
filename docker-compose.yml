services:
  postgres:
    image: postgres:16-alpine
    container_name: wms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wms_dev
    ports:
      # Puerto poco común en el host para no chocar con Postgres locales (5432/5433)
      - "127.0.0.1:55432:5432"
    volumes:
      - wms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wms_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  wms_pgdata:
